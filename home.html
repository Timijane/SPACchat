<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>SPACchat — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        :root {
            --p: #5B3C88; --pl: #7B5CA8; --pg: rgba(91,60,136,0.2);
            --s: #FF7A59; --sg: rgba(255,122,89,0.25);
            --bg: #F7F3EC; --bg2: #EDE8DF; --c: #FFFFFF;
            --t: #2E2E2E; --t2: #5A5560; --tm: #8B8690;
            --a: #2BB3C0; --ok: #2EAD67; --err: #E74C3C;
            --b: #E0DCD5; --r: 10px; --rm: 14px; --rl: 20px;
            --sh: 0 2px 8px rgba(0,0,0,0.05); --sh2: 0 8px 32px rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg: #1A1625; --bg2: #211D30; --c: #282238;
            --t: #F0EDF5; --t2: #B8B2C4; --tm: #7B7590; --b: #3A3450;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{height:100%;-webkit-tap-highlight-color:transparent}
        body{
            font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            background:var(--bg);color:var(--t);height:100vh;height:100dvh;
            overflow:hidden;-webkit-font-smoothing:antialiased;
            display:flex;flex-direction:column;
            transition:background .4s,color .4s;
        }
        #loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s,visibility .5s}
        #loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
        .spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--b);border-top-color:var(--p);animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .loader-t{color:var(--tm);font-size:13px;font-weight:500}

        .header{flex-shrink:0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--p);color:#fff;z-index:10}
        .hl{display:flex;align-items:center;gap:10px}
        .hlogo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:#fff}
        .htitle{font-family:'Playfair Display',serif;font-size:20px;font-weight:800;color:#fff}
        .hr{display:flex;align-items:center;gap:4px}
        .hbtn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.2s;position:relative}
        .hbtn:hover{background:rgba(255,255,255,.25)}
        .badge{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--s);border:2px solid var(--p);display:none}
        .badge.on{display:block}

        .main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
        .main::-webkit-scrollbar{width:0}

        .stories-wrap{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--b)}
        .stories-row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory}
        .stories-row::-webkit-scrollbar{height:0}
        .si{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;cursor:pointer;scroll-snap-align:start;background:none;border:none;font-family:'Inter',sans-serif;transition:transform .15s}
        .si:active{transform:scale(.93)}
        .sr{width:56px;height:56px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#5B3C88,#FF7A59,#2BB3C0);display:flex;align-items:center;justify-content:center}
        .sr.mine{background:var(--b);position:relative}
        .sr.mine::after{content:'+';position:absolute;bottom:-1px;right:-1px;width:20px;height:20px;border-radius:50%;background:var(--p);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
        .sr.viewed{background:var(--b)}
        .sa{width:48px;height:48px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;object-fit:cover;border:2px solid var(--c)}
        .sn{font-size:10px;color:var(--t2);max-width:58px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}

        .create-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg)}
        .ca{width:38px;height:38px;border-radius:50%;background:var(--p);color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
        .ci{flex:1;padding:10px 16px;border-radius:22px;background:var(--c);border:1.5px solid var(--b);color:var(--tm);font-size:14px;font-family:'Inter',sans-serif;cursor:pointer;text-align:left;transition:.3s}
        .ci:hover{border-color:var(--p)}
        .cp{width:38px;height:38px;border-radius:50%;background:var(--s);border:none;color:#fff;font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s}
        .cp:active{transform:scale(.88)}

        .post{background:var(--c);margin:8px 12px;border-radius:var(--rm);padding:12px 14px;border:1px solid var(--b);box-shadow:var(--sh);animation:fi .35s forwards;opacity:0;transition:background .3s,border-color .3s}
        @keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}
        .pa{width:38px;height:38px;border-radius:50%;background:var(--p);color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
        .pi{flex:1;min-width:0}
        .pn{font-weight:600;font-size:13px;color:var(--t);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
        .pt{font-size:10px;color:var(--tm)}
        .rb{font-size:10px;color:var(--a);font-weight:500;display:inline-flex;align-items:center;gap:3px}
        .pb{font-size:14px;line-height:1.5;color:var(--t);margin-bottom:6px;word-break:break-word;position:relative}
        .pb.trunc{max-height:80px;overflow:hidden}
        .pb.trunc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(transparent,var(--c))}
        .rml{color:var(--a);font-size:12px;font-weight:600;cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif;display:block;margin:4px 0}
        .pimgs{display:grid;gap:3px;margin-bottom:6px}
        .pimgs.g1{grid-template-columns:1fr}
        .pimgs.g2{grid-template-columns:1fr 1fr}
        .pimgs.g3{grid-template-columns:1fr 1fr}
        .pimgs.g3 img:first-child{grid-row:span 2}
        .pimgs.g4{grid-template-columns:1fr 1fr}
        .pimg{width:100%;border-radius:var(--r);object-fit:cover;cursor:pointer;max-height:300px;background:var(--bg2)}
        .pvoice{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-radius:var(--r);margin-bottom:6px;cursor:pointer}
        .pvoice audio{width:100%;height:32px}
        .pacts{display:flex;align-items:center;justify-content:space-between;padding:6px 0 0;border-top:1px solid var(--b);gap:0;flex-wrap:nowrap}
        .pact{display:flex;align-items:center;gap:2px;background:none;border:none;color:var(--tm);cursor:pointer;font-size:11px;font-weight:500;padding:5px 6px;border-radius:var(--r);transition:.2s;font-family:'Inter',sans-serif;white-space:nowrap;flex-shrink:1;min-width:0}
        .pact:hover{background:var(--bg2);color:var(--t)}
        .pact.on{color:var(--s)}
        .pact.svd{color:var(--a)}
        .pact .pi-icon{font-size:14px;transition:transform .2s;flex-shrink:0}
        .pact:active .pi-icon{transform:scale(1.3)}
        .pact .cnt{font-size:10px}

        .modal-overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.3s}
        .modal-overlay.on{opacity:1;visibility:visible}
        .modal-sheet{background:var(--c);border-radius:var(--rl) var(--rl) 0 0;padding:20px 18px 24px;width:100%;max-width:500px;max-height:82vh;overflow-y:auto;transform:translateY(40px);transition:transform .35s cubic-bezier(.32,.72,0,1);border:1px solid var(--b);padding-bottom:max(24px,env(safe-area-inset-bottom))}
        .modal-overlay.on .modal-sheet{transform:translateY(0)}
        .mhandle{width:32px;height:4px;border-radius:2px;background:var(--b);margin:0 auto 12px}
        .mhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
        .mtitle{font-size:16px;font-weight:700}
        .mclose{width:28px;height:28px;border-radius:50%;background:var(--bg2);border:none;color:var(--t2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
        .mclose:hover{background:var(--err);color:#fff}
        .mtextarea{width:100%;min-height:80px;background:var(--bg);border:1.5px solid var(--b);border-radius:var(--r);padding:10px;color:var(--t);font-size:14px;font-family:'Inter',sans-serif;resize:vertical;outline:none;transition:.3s}
        .mtextarea:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pg)}
        .mchips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
        .mchip{padding:6px 10px;border-radius:16px;background:var(--bg);border:1px solid var(--b);color:var(--t2);font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:4px;transition:.2s}
        .mchip:hover{border-color:var(--p);color:var(--p)}
        .mbtn{width:100%;padding:12px;border-radius:var(--r);background:var(--p);color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;margin-top:10px;font-family:'Inter',sans-serif;transition:.2s}
        .mbtn:hover{background:var(--pl)}
        .mbtn:disabled{opacity:.5;cursor:not-allowed}
        .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(75px,1fr));gap:6px;margin-top:8px}
        .preview-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden}
        .preview-item img,.preview-item video{width:100%;height:100%;object-fit:cover}
        .preview-item .rm-btn{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:var(--err);color:#fff;border:none;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .voice-preview{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:var(--r);margin-top:6px}

        .contrib-list{margin-top:6px;max-height:220px;overflow-y:auto}
        .contrib-item{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--b);align-items:flex-start}
        .contrib-av{width:26px;height:26px;border-radius:50%;background:var(--p);color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px}
        .contrib-body{flex:1}
        .contrib-name{font-weight:600;font-size:11px;color:var(--t)}
        .contrib-text{font-size:12px;color:var(--t2);margin-top:1px}
        .contrib-time{font-size:9px;color:var(--tm)}
        .contrib-acts{display:flex;gap:8px;margin-top:3px}
        .contrib-act{background:none;border:none;color:var(--tm);font-size:10px;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:2px}

        .story-viewer{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.3s;flex-direction:column}
        .story-viewer.on{opacity:1;visibility:visible}
        .story-viewer img,.story-viewer video{max-width:100%;max-height:85vh;object-fit:contain;border-radius:8px}
        .story-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;border:none;font-size:20px;cursor:pointer;z-index:201;display:flex;align-items:center;justify-content:center}
        .story-nav{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:201}
        .story-dot{width:28px;height:3px;border-radius:2px;background:rgba(255,255,255,.4);transition:.3s}
        .story-dot.act{background:#fff;width:36px}

        .empty{text-align:center;padding:50px 24px;color:var(--tm)}
        .empty-icon{font-size:48px;margin-bottom:8px}
        .empty-title{font-size:15px;font-weight:600;color:var(--t2)}
        .empty-desc{font-size:12px;margin-top:3px}

        .nav{flex-shrink:0;display:flex;align-items:center;justify-content:space-around;padding:6px 6px 10px;background:var(--c);border-top:1px solid var(--b);z-index:10;padding-bottom:max(10px,env(safe-area-inset-bottom))}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:5px 8px;border-radius:10px;transition:.2s;background:none;border:none;color:var(--tm);font-family:'Inter',sans-serif;text-decoration:none}
        .nav-item.act{color:var(--p)}
        .nav-icon{font-size:19px}
        .nav-label{font-size:9px;font-weight:500}

        .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-140px);padding:10px 18px;border-radius:var(--r);font-size:12px;font-weight:600;z-index:300;transition:transform .4s cubic-bezier(.175,.885,.32,1.275);box-shadow:var(--sh2);white-space:nowrap;background:var(--ok);color:#fff}
        .toast.err{background:var(--err)}
        .toast.show{transform:translateX(-50%) translateY(0)}

        .settings-btn{position:fixed;bottom:80px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--c);border:1px solid var(--b);box-shadow:var(--sh2);z-index:50;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--t2);transition:.2s}
        .settings-btn:hover{background:var(--bg2)}

        @media(min-width:768px){body{max-width:500px;margin:0 auto;border-left:1px solid var(--b);border-right:1px solid var(--b)}}
    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p class="loader-t">Loading SPACchat...</p></div>
<div class="toast" id="toast"></div>

<header class="header">
    <div class="hl"><div class="hlogo">S</div><span class="htitle">SPACchat</span></div>
    <div class="hr">
        <button class="hbtn" id="themeToggle" title="Toggle theme">🌓</button>
        <button class="hbtn" id="notifBtn" title="Notifications">🔔<span class="badge" id="notifBadge"></span></button>
        <button class="hbtn" onclick="location.href='profile.html'" title="Profile"><span id="headerAv">👤</span></button>
    </div>
</header>

<div class="main" id="mainContent">
    <div class="stories-wrap"><div class="stories-row" id="storiesRow"></div></div>
    <div class="create-bar">
        <div class="ca" id="barAv">OK</div>
        <button class="ci" id="openCreate">Proclaim something...</button>
        <button class="cp" id="openCreatePlus">+</button>
    </div>
    <div id="feed"></div>
</div>

<nav class="nav">
    <button class="nav-item act"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></button>
    <button class="nav-item" onclick="location.href='chat.html'"><span class="nav-icon">💬</span><span class="nav-label">Chat</span></button>
    <button class="nav-item" onclick="location.href='media.html'"><span class="nav-icon">🎵</span><span class="nav-label">Media</span></button>
    <button class="nav-item" onclick="location.href='groups.html'"><span class="nav-icon">👥</span><span class="nav-label">Groups</span></button>
    <button class="nav-item" onclick="location.href='profile.html'"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></button>
</nav>

<div class="settings-btn" id="settingsBtn" title="Settings">⚙️</div>

<!-- CREATE POST MODAL -->
<div class="modal-overlay" id="postModal">
    <div class="modal-sheet">
        <div class="mhandle"></div>
        <div class="mhdr"><span class="mtitle">New Proclamation</span><button class="mclose" id="closePostModal">✕</button></div>
        <textarea class="mtextarea" id="postContent" placeholder="What's on your spirit today?"></textarea>
        <div class="mchips">
            <button class="mchip" id="uploadImgBtn">📷 Photos</button>
            <button class="mchip" id="uploadVidBtn">🎬 Video</button>
            <button class="mchip" id="recordVoiceBtn">🎤 Voice</button>
            <button class="mchip" id="uploadDocBtn">📎 File</button>
        </div>
        <input type="file" id="imgInput" accept="image/*" multiple style="display:none">
        <input type="file" id="vidInput" accept="video/*" style="display:none">
        <input type="file" id="docInput" accept=".pdf,.doc,.docx,.txt" style="display:none">
        <div class="preview-grid" id="mediaPreview"></div>
        <div class="voice-preview" id="voicePreview" style="display:none"></div>
        <button class="mbtn" id="submitPost">Proclaim 🔥</button>
    </div>
</div>

<!-- CONTRIBUTIONS MODAL -->
<div class="modal-overlay" id="contribModal">
    <div class="modal-sheet">
        <div class="mhandle"></div>
        <div class="mhdr"><span class="mtitle">Contributions</span><button class="mclose" id="closeContribModal">✕</button></div>
        <div class="contrib-list" id="contribList"></div>
        <textarea class="mtextarea" id="contribInput" placeholder="Add a contribution..." style="margin-top:8px;min-height:50px;"></textarea>
        <button class="mbtn" id="submitContrib">Send Contribution</button>
    </div>
</div>

<!-- STORY VIEWER -->
<div class="story-viewer" id="storyViewer">
    <button class="story-close" id="closeStoryViewer">✕</button>
    <div id="storyContent"></div>
    <div class="story-nav" id="storyNav"></div>
</div>

<!-- STORY CREATE MODAL -->
<div class="modal-overlay" id="storyModal">
    <div class="modal-sheet">
        <div class="mhandle"></div>
        <div class="mhdr"><span class="mtitle">Add Story</span><button class="mclose" id="closeStoryModal">✕</button></div>
        <div class="mchips" style="justify-content:center">
            <button class="mchip" id="storyImgBtn">📷 Photo</button>
            <button class="mchip" id="storyVidBtn">🎬 Video</button>
        </div>
        <input type="file" id="storyImgInput" accept="image/*" style="display:none">
        <input type="file" id="storyVidInput" accept="video/*" style="display:none">
        <div id="storyPreview" style="text-align:center;margin-top:10px;"></div>
        <button class="mbtn" id="submitStory">Post Story</button>
    </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-sheet">
        <div class="mhandle"></div>
        <div class="mhdr"><span class="mtitle">Settings</span><button class="mclose" id="closeSettingsModal">✕</button></div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--b);cursor:pointer" id="darkModeRow">
            <span style="font-weight:500">🌙 Dark Mode</span>
            <div id="darkToggle" style="width:48px;height:26px;border-radius:13px;background:var(--b);position:relative;transition:.3s">
                <div style="width:22px;height:22px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.2)"></div>
            </div>
        </div>
        <button class="mbtn" onclick="auth.signOut();location.href='index.html'" style="background:var(--err);margin-top:16px">Log Out</button>
    </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const FC={apiKey:"AIzaSyCo6bD1yB9SHG4Iem-MhniQ4YyOEQv-_YA",authDomain:"spacchat-e35b8.firebaseapp.com",projectId:"spacchat-e35b8",storageBucket:"spacchat-e35b8.firebasestorage.app",messagingSenderId:"407081887262",appId:"1:407081887262:web:62879d6d38f6482982700f"};
const SU="https://akbwcgzymrygsjpmwysm.supabase.co";
const SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYndjZ3p5bXJ5Z3NqcG13eXNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTE4MjUsImV4cCI6MjA5NDg2NzgyNX0.--2SPkyKOI2aWACgib6uPUFTzLvHlocPfdRZvUeLGI4";
const CC="dcwof2ngn",CP="Meet_video";

const app=initializeApp(FC);
const auth=getAuth(app);
window.auth=auth;

let cu=null,cp=null,posts=[],upMedia=[],upVoice=null,storyMedia=null,actPid=null,storyIdx=0,allStories=[];

const $=id=>document.getElementById(id);
const T=(m,e)=>{const t=$('toast');t.textContent=m;t.className='toast'+(e?' err':'');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500)};
const ini=n=>{if(!n)return'??';const p=n.trim().split(/\s+/);return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():n.substring(0,2).toUpperCase()};
const ta=d=>{const s=Math.floor((Date.now()-new Date(d).getTime())/1000);if(isNaN(s))return'';if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<604800)return Math.floor(s/86400)+'d';return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'})};

// FEED
async function getFeed(){
    try{
        const[pRes,rRes]=await Promise.all([
            fetch(`${SU}/rest/v1/posts?post_status=eq.published&order=created_at.desc&limit=60`,{headers:{'apikey':SK,'Authorization':`Bearer ${SK}`}}),
            fetch(`${SU}/rest/v1/reproclaims?order=created_at.desc&limit=30`,{headers:{'apikey':SK,'Authorization':`Bearer ${SK}`}})
        ]);
        const rp=pRes.ok?await pRes.json():[];
        const repros=rRes.ok?await rRes.json():[];
        const items=[],pm={};
        rp.forEach(p=>{pm[p.id]=p;items.push({type:'post',data:p,time:p.created_at})});
        for(const r of repros){
            if(pm[r.post_id])items.push({type:'repro',data:{...pm[r.post_id],repro_by:r.user_id,repro_at:r.created_at},time:r.created_at});
            else{try{const rp2=await suF(`/rest/v1/posts?id=eq.${r.post_id}&limit=1`);if(rp2[0])items.push({type:'repro',data:{...rp2[0],repro_by:r.user_id,repro_at:r.created_at},time:r.created_at})}catch(e){}}
        }
        items.sort((a,b)=>new Date(b.time)-new Date(a.time));
        return items.slice(0,80);
    }catch(e){return[]}
}

async function renderFeed(){
    const f=$('feed');f.innerHTML='';
    const items=await getFeed();
    if(!items.length){f.innerHTML='<div class="empty"><div class="empty-icon">🕊️</div><div class="empty-title">No proclamations yet</div><div class="empty-desc">Be the first to proclaim!</div></div>';return}
    const uids=[...new Set(items.map(i=>i.data.user_id).concat(items.map(i=>i.data.repro_by).filter(Boolean)))];
    const um={};for(const uid of uids){um[uid]=await getProfile(uid)}
    let uReacts=new Set,uSaves=new Set;
    if(cu){try{const[rr,ss]=await Promise.all([suF(`/rest/v1/reactions?user_id=eq.${cu.uid}&reaction_type=eq.spac`),suF(`/rest/v1/saved_posts?user_id=eq.${cu.uid}`)]);rr.forEach(r=>uReacts.add(r.post_id));ss.forEach(s=>uSaves.add(s.post_id))}catch(e){}}
    items.forEach((item,i)=>{
        const post=item.data,card=document.createElement('div');
        card.className='post';card.style.animationDelay=`${i*0.02}s`;card.setAttribute('data-pid',post.id);
        const pr=um[post.user_id],rpr=post.repro_by?um[post.repro_by]:null;
        const dn=pr?.full_name||pr?.username||post.user_id?.substring(0,8)||'User';
        const rn=rpr?.full_name||rpr?.username||post.repro_by?.substring(0,8)||'';
        const hasMedia=post.media_urls&&post.media_urls.length>0;
        const isLong=post.content&&post.content.length>200;
        let mediaHTML='';
        if(hasMedia){
            const isVideo=post.media_urls.some(u=>u.match(/\.(mp4|webm|mov)/i));
            if(isVideo||post.post_type==='video'){
                mediaHTML=post.media_urls.map(u=>u.match(/\.(mp4|webm|mov)/i)?`<video class="pimg" controls preload="metadata" style="max-height:300px"><source src="${u}" type="video/mp4"></video>`:`<img class="pimg" src="${u}" loading="lazy" onclick="window.open('${u}','_blank')">`).join('');
            }else{
                const n=post.media_urls.length,gc=n===1?'g1':n===2?'g2':n===3?'g3':'g4';
                mediaHTML=`<div class="pimgs ${gc}">${post.media_urls.map(u=>`<img class="pimg" src="${u}" loading="lazy" onclick="window.open('${u}','_blank')">`).join('')}</div>`;
            }
        }
        if(post.post_type==='voice'&&post.media_urls&&post.media_urls[0]){
            mediaHTML=`<div class="pvoice"><audio controls src="${post.media_urls[0]}"></audio></div>`;
        }
        let reproHTML='';
        if(item.type==='repro'&&rn){
            reproHTML=`<div class="rb">🔄 <strong>${eh(rn)}</strong> reproclaimed • ${ta(post.repro_at)}</div>`;
        }
        card.innerHTML=`${reproHTML}<div class="ph"><div class="pa">${ini(dn)}</div><div class="pi"><div class="pn">${eh(dn)}</div><div class="pt">${ta(post.created_at)}</div></div></div>
        <div class="pb${isLong?' trunc':''}" id="body-${post.id}">${eh(post.content||'')}</div>${isLong?`<button class="rml" data-pid="${post.id}" data-action="readmore">Read more</button>`:''}
        ${mediaHTML}
        <div class="pacts">
            <button class="pact sb ${uReacts.has(post.id)?'on':''}" data-pid="${post.id}"><span class="pi-icon">🔥</span><span class="cnt">${post.spac_count||0}</span></button>
            <button class="pact cb" data-pid="${post.id}"><span class="pi-icon">💬</span><span class="cnt">${post.contribution_count||0}</span></button>
            <button class="pact rb" data-pid="${post.id}"><span class="pi-icon">🔄</span><span class="cnt">${post.reproclaim_count||0}</span></button>
            <button class="pact shb" data-pid="${post.id}"><span class="pi-icon">📤</span><span class="cnt">${post.share_count||0}</span></button>
            <button class="pact svb ${uSaves.has(post.id)?'svd':''}" data-pid="${post.id}"><span class="pi-icon">🔖</span></button>
        </div>`;
        f.appendChild(card);
    });
}

async function spac(pid,btn){if(!cu)return T('Sign in first',1);const isS=btn.classList.contains('on');const ce=btn.querySelector('.cnt');let cnt=parseInt(ce.textContent)||0;if(isS){btn.classList.remove('on');ce.textContent=Math.max(0,cnt-1);await fetch(`${SU}/rest/v1/reactions?post_id=eq.${pid}&user_id=eq.${cu.uid}&reaction_type=eq.spac`,{method:'DELETE',headers:{'apikey':SK,'Authorization':`Bearer ${SK}`}})}else{btn.classList.add('on');ce.textContent=cnt+1;const ic=btn.querySelector('.pi-icon');ic.style.transform='scale(1.4)';setTimeout(()=>ic.style.transform='scale(1)',200);await fetch(`${SU}/rest/v1/reactions`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SK,'Authorization':`Bearer ${SK}`,'Prefer':'return=minimal'},body:JSON.stringify({post_id:pid,user_id:cu.uid,reaction_type:'spac',created_at:new Date().toISOString()})})}}

async function repro(pid,btn){if(!cu)return T('Sign in first',1);const chk=await fetch(`${SU}/rest/v1/reproclaims?user_id=eq.${cu.uid}&post_id=eq.${pid}&limit=1`,{headers:{'apikey':SK,'Authorization':`Bearer ${SK}`}});const ex=await chk.json();if(ex.length>0)return T('Already reproclaimed');await fetch(`${SU}/rest/v1/reproclaims`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SK,'Authorization':`Bearer ${SK}`,'Prefer':'return=minimal'},body:JSON.stringify({user_id:cu.uid,post_id:pid,created_at:new Date().toISOString()})});const ce=btn.querySelector('.cnt');ce.textContent=(parseInt(ce.textContent)||0)+1;T('Reproclaimed! 🔄');setTimeout(renderFeed,600)}

async function shareP(pid,btn){const url=`${location.origin}/post/${pid}`;let ok=false;if(navigator.share){try{await navigator.share({title:'SPACchat',url});ok=true}catch(e){}}
if(!ok){try{await navigator.clipboard.writeText(url);ok=true;T('Link copied! 📤')}catch(e){}}
if(ok){const ce=btn.querySelector('.cnt');const nc=(parseInt(ce.textContent)||0)+1;ce.textContent=nc;await fetch(`${SU}/rest/v1/posts?id=eq.${pid}`,{method:'PATCH',headers:{'Content-Type':'application/json','apikey':SK,'Authorization':`Bearer ${SK}`,'Prefer':'return=minimal'},body:JSON.stringify({share_count:nc})})}}

async function saveP(pid,btn){if(!cu)return T('Sign in first',1);const isS=btn.classList.contains('svd');const ic=btn.querySelector('.pi-icon');if(isS){btn.classList.remove('svd');ic.textContent='🔖';await fetch(`${SU}/rest/v1/saved_posts?user_id=eq.${cu.uid}&post_id=eq.${pid}`,{method:'DELETE',headers:{'apikey':SK,'Authorization':`Bearer ${SK}`}});T('Removed')}else{btn.classList.add('svd');ic.textContent='🔖✓';await fetch(`${SU}/rest/v1/saved_posts`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SK,'Authorization':`Bearer ${SK}`,'Prefer':'return=minimal'},body:JSON.stringify({user_id:cu.uid,post_id:pid,collection:'default',created_at:new Date().toISOString()})});T('Saved!')}}

async function uploadToCloud(file,type='image'){
    const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CP);fd.append('cloud_name',CC);
    if(type==='video')fd.append('resource_type','video');
    const r=await fetch(`https://api.cloudinary.com/v1_1/${CC}/${type}/upload`,{method:'POST',body:fd});
    const d=await r.json();return d.secure_url||null;
}

    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(stream);const chunks=[];mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=async()=>{const blob=new Blob(chunks,{type:'audio/webm'});const url=await uploadToCloud(new File([blob],'voice.webm',{type:'audio/webm'}),'video');if(url){upVoice=url;$('voicePreview').style.display='block';$('voicePreview').innerHTML=`<span>🎤 Voice note recorded</span><audio controls src="${url}" style="width:100%;height:28px"></audio>`}stream.getTracks().forEach(t=>t.stop())};mr.start();setTimeout(()=>mr.stop(),60000);T('Recording... Speak now (max 60s)');$('voicePreview').style.display='block';$('voicePreview').innerHTML='<span style="color:var(--err)">🔴 Recording...</span>'}catch(e){T('Microphone access denied',1)}
});

async function handleMediaInput(input,type){

async function submitPost(){
    const content=$('postContent').value.trim();
    if(!content&&!upMedia.length&&!upVoice)return T('Add content or media',1);
    if(!cu)return T('Sign in first',1);
    const btn=$('submitPost');btn.disabled=true;btn.textContent='Proclaiming...';
    const now=new Date().toISOString();
    const body={user_id:cu.uid,content:content||'',post_status:'published',created_at:now,updated_at:now};
    if(upVoice){body.post_type='voice';body.media_urls=[upVoice]}
    else if(upMedia.length){const hasVideo=upMedia.some(m=>m.type==='video');body.post_type=hasVideo?'video':'image';body.media_urls=upMedia.map(m=>m.url)}

    try{await fetch(`${SU}/rest/v1/posts`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SK,'Authorization':`Bearer ${SK}`,'Prefer':'return=representation'},body:JSON.stringify(body)});closePost();await renderFeed();T('Proclaimed! 🔥')}catch(e){T('Failed. Try again.',1)}finally{btn.disabled=false;btn.textContent='Proclaim 🔥'}
}
