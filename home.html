<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="SPACchat - Spiritual Social Platform">
    <meta name="theme-color" content="#5B3C88">
    <title>SPACchat — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    
    <style>
        /* ============ CSS Custom Properties ============ */
        :root {
            --p: #5B3C88;
            --pl: #7B5CA8;
            --pd: #46306A;
            --pg: rgba(91, 60, 136, 0.2);
            --s: #FF7A59;
            --sg: rgba(255, 122, 89, 0.25);
            --bg: #F7F3EC;
            --bg2: #EDE8DF;
            --c: #FFFFFF;
            --t: #2E2E2E;
            --t2: #5A5560;
            --tm: #8B8690;
            --a: #2BB3C0;
            --ok: #2EAD67;
            --err: #E74C3C;
            --b: #E0DCD5;
            --r: 10px;
            --rm: 14px;
            --rl: 20px;
            --sh: 0 2px 8px rgba(0,0,0,0.05);
            --sh2: 0 8px 32px rgba(0,0,0,0.1);
            --tr: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Accessibility */
            --focus-ring: 0 0 0 3px rgba(91, 60, 136, 0.4);
            --focus-visible: 0 0 0 3px var(--p);
        }

        [data-theme="dark"] {
            --bg: #1A1625;
            --bg2: #211D30;
            --c: #282238;
            --t: #F0EDF5;
            --t2: #B8B2C4;
            --tm: #7B7590;
            --b: #3A3450;
            --sh: 0 2px 8px rgba(0,0,0,0.2);
            --sh2: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* ============ Reset & Base ============ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--t);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            transition: background var(--tr), color var(--tr);
            line-height: 1.5;
        }

        /* Focus styles for accessibility */
        :focus-visible {
            outline: 2px solid var(--p);
            outline-offset: 2px;
            border-radius: 4px;
        }

        button:focus:not(:focus-visible) {
            outline: none;
        }

        /* ============ Loader ============ */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.5s, visibility 0.5s;
        }

        #loader[aria-hidden="true"] {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid var(--b);
            border-top-color: var(--p);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-t {
            color: var(--tm);
            font-size: 13px;
            font-weight: 500;
        }

        /* ============ Header ============ */
        .header {
            flex-shrink: 0;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--p);
            color: #fff;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .hl {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hlogo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            user-select: none;
        }

        .htitle {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            user-select: none;
        }

        .hr {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hbtn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: rgba(255,255,255,0.15);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background var(--tr), border-color var(--tr);
            position: relative;
        }

        .hbtn:hover {
            background: rgba(255,255,255,0.25);
        }

        .hbtn:focus-visible {
            border-color: #fff;
            outline: none;
        }

        .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            min-width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--s);
            border: 2px solid var(--p);
            display: none;
            font-size: 0;
        }

        .badge[data-visible="true"] {
            display: block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* ============ Main Content ============ */
        .main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .main::-webkit-scrollbar {
            width: 4px;
        }

        .main::-webkit-scrollbar-thumb {
            background: var(--b);
            border-radius: 2px;
        }

        /* ============ Stories ============ */
        .stories-wrap {
            padding: 12px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--b);
        }

        .stories-row {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .stories-row::-webkit-scrollbar {
            height: 0;
        }

        .si {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            cursor: pointer;
            scroll-snap-align: start;
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
            transition: transform 0.15s;
            padding: 2px;
        }

        .si:active {
            transform: scale(0.93);
        }

        .sr {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #5B3C88, #FF7A59, #2BB3C0);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sr.mine {
            background: var(--b);
            position: relative;
        }

        .sr.mine::after {
            content: '+';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--p);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg);
            line-height: 1;
        }

        .sr.viewed {
            background: var(--b);
        }

        .sa {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--p);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            object-fit: cover;
            border: 2px solid var(--c);
            user-select: none;
        }

        .sn {
            font-size: 10px;
            color: var(--t2);
            max-width: 58px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }

        /* ============ Create Bar ============ */
        .create-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--bg);
        }

        .ca {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--p);
            color: #fff;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            user-select: none;
        }

        .ci {
            flex: 1;
            padding: 10px 16px;
            border-radius: 22px;
            background: var(--c);
            border: 1.5px solid var(--b);
            color: var(--tm);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-align: left;
            transition: border-color var(--tr), box-shadow var(--tr);
        }

        .ci:hover {
            border-color: var(--p);
        }

        .ci:focus-visible {
            box-shadow: var(--focus-ring);
            outline: none;
        }

        .cp {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--s);
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background var(--tr);
        }

        .cp:active {
            transform: scale(0.88);
        }

        /* ============ Posts ============ */
        .post {
            background: var(--c);
            margin: 8px 12px;
            border-radius: var(--rm);
            padding: 12px 14px;
            border: 1px solid var(--b);
            box-shadow: var(--sh);
            animation: fadeInUp 0.35s forwards;
            opacity: 0;
            transition: background var(--tr), border-color var(--tr);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ph {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .pa {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--p);
            color: #fff;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            user-select: none;
        }

        .pi {
            flex: 1;
            min-width: 0;
        }

        .pn {
            font-weight: 600;
            font-size: 13px;
            color: var(--t);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .pt {
            font-size: 10px;
            color: var(--tm);
        }

        .rb {
            font-size: 10px;
            color: var(--a);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-bottom: 4px;
        }

        .pb {
            font-size: 14px;
            line-height: 1.5;
            color: var(--t);
            margin-bottom: 6px;
            word-break: break-word;
            position: relative;
        }

        .pb.trunc {
            max-height: 80px;
            overflow: hidden;
        }

        .pb.trunc::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(transparent, var(--c));
            pointer-events: none;
        }

        .rml {
            color: var(--a);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: 2px solid transparent;
            font-family: 'Inter', sans-serif;
            display: block;
            margin: 4px 0;
            padding: 4px 0;
            transition: color var(--tr);
        }

        .rml:hover {
            color: var(--p);
            text-decoration: underline;
        }

        .pimgs {
            display: grid;
            gap: 3px;
            margin-bottom: 6px;
        }

        .pimgs.g1 { grid-template-columns: 1fr; }
        .pimgs.g2 { grid-template-columns: 1fr 1fr; }
        .pimgs.g3 { 
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
        }
        .pimgs.g3 img:first-child { 
            grid-row: span 2;
            height: 100%;
        }
        .pimgs.g4 { grid-template-columns: 1fr 1fr; }

        .pimg {
            width: 100%;
            border-radius: var(--r);
            object-fit: cover;
            cursor: pointer;
            max-height: 300px;
            background: var(--bg2);
            transition: opacity 0.3s;
        }

        .pimg:hover {
            opacity: 0.9;
        }

        .pvoice {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg2);
            border-radius: var(--r);
            margin-bottom: 6px;
            cursor: pointer;
        }

        .pvoice audio {
            width: 100%;
            height: 32px;
        }

        /* Post Actions */
        .pacts {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0 0;
            border-top: 1px solid var(--b);
            gap: 0;
            flex-wrap: nowrap;
        }

        .pact {
            display: flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: 2px solid transparent;
            color: var(--tm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 8px;
            border-radius: var(--r);
            transition: background var(--tr), color var(--tr);
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            flex-shrink: 1;
            min-width: 0;
        }

        .pact:hover {
            background: var(--bg2);
            color: var(--t);
        }

        .pact:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        .pact[aria-pressed="true"] {
            color: var(--s);
        }

        .pact.svd {
            color: var(--a);
        }

        .pact .pi-icon {
            font-size: 16px;
            transition: transform 0.2s;
            flex-shrink: 0;
            pointer-events: none;
        }

        .pact:active .pi-icon {
            transform: scale(1.3);
        }

        .pact .cnt {
            font-size: 11px;
            pointer-events: none;
        }

        /* ============ Modals ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 150;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--tr), visibility var(--tr);
        }

        .modal-overlay[aria-hidden="false"] {
            opacity: 1;
            visibility: visible;
        }

        .modal-sheet {
            background: var(--c);
            border-radius: var(--rl) var(--rl) 0 0;
            padding: 20px 18px;
            width: 100%;
            max-width: 500px;
            max-height: 82vh;
            overflow-y: auto;
            transform: translateY(40px);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            border: 1px solid var(--b);
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }

        .modal-overlay[aria-hidden="false"] .modal-sheet {
            transform: translateY(0);
        }

        .mhandle {
            width: 32px;
            height: 4px;
            border-radius: 2px;
            background: var(--b);
            margin: 0 auto 12px;
        }

        .mhdr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .mtitle {
            font-size: 16px;
            font-weight: 700;
        }

        .mclose {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg2);
            border: 2px solid transparent;
            color: var(--t2);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--tr), color var(--tr);
        }

        .mclose:hover {
            background: var(--err);
            color: #fff;
        }

        .mclose:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        .mtextarea {
            width: 100%;
            min-height: 80px;
            background: var(--bg);
            border: 1.5px solid var(--b);
            border-radius: var(--r);
            padding: 10px;
            color: var(--t);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            outline: none;
            transition: border-color var(--tr), box-shadow var(--tr);
        }

        .mtextarea:focus {
            border-color: var(--p);
            box-shadow: var(--focus-ring);
        }

        .mchips {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .mchip {
            padding: 6px 12px;
            border-radius: 16px;
            background: var(--bg);
            border: 1.5px solid var(--b);
            color: var(--t2);
            font-size: 12px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: border-color var(--tr), color var(--tr), background var(--tr);
        }

        .mchip:hover {
            border-color: var(--p);
            color: var(--p);
            background: var(--c);
        }

        .mbtn {
            width: 100%;
            padding: 12px;
            border-radius: var(--r);
            background: var(--p);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid transparent;
            cursor: pointer;
            margin-top: 12px;
            font-family: 'Inter', sans-serif;
            transition: background var(--tr), transform 0.1s;
        }

        .mbtn:hover:not(:disabled) {
            background: var(--pl);
        }

        .mbtn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .mbtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 6px;
            margin-top: 8px;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--b);
        }

        .preview-item img,
        .preview-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-item .rm-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--err);
            color: #fff;
            border: 2px solid #fff;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            z-index: 2;
        }

        .preview-item .rm-btn:hover {
            transform: scale(1.2);
        }

        .voice-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg);
            border-radius: var(--r);
            margin-top: 6px;
            border: 1px solid var(--b);
        }

        /* ============ Contributions ============ */
        .contrib-list {
            margin-top: 6px;
            max-height: 220px;
            overflow-y: auto;
        }

        .contrib-item {
            display: flex;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid var(--b);
            align-items: flex-start;
        }

        .contrib-av {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--p);
            color: #fff;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
            user-select: none;
        }

        .contrib-body {
            flex: 1;
        }

        .contrib-name {
            font-weight: 600;
            font-size: 12px;
            color: var(--t);
        }

        .contrib-text {
            font-size: 12px;
            color: var(--t2);
            margin-top: 2px;
            line-height: 1.4;
        }

        .contrib-time {
            font-size: 9px;
            color: var(--tm);
        }

        .contrib-acts {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .contrib-act {
            background: none;
            border: 1px solid transparent;
            color: var(--tm);
            font-size: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color var(--tr), background var(--tr);
        }

        .contrib-act:hover {
            color: var(--p);
            background: var(--bg2);
        }

        /* ============ Story Viewer ============ */
        .story-viewer {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--tr), visibility var(--tr);
            flex-direction: column;
        }

        .story-viewer[aria-hidden="false"] {
            opacity: 1;
            visibility: visible;
        }

        .story-viewer img,
        .story-viewer video {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .story-close {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 2px solid transparent;
            font-size: 22px;
            cursor: pointer;
            z-index: 201;

            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        // Throttle utility
        function throttle(fn, limit = 300) {
            let inThrottle;
            return function(...args) {
                if (!inThrottle) {
                    fn.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);

                clearTimeout(this._timeout);
                toast.textContent = message;
                toast.className = `toast${isError ? ' error' : ''}`;
                toast.setAttribute('aria-hidden', 'false');
                
                this._timeout = setTimeout(() => {

        // Get initials from name

        // Time ago formatter
        function timeAgo(date) {
            if (!date) return '';
            const seconds = Math.floor((Date.now() - new Date(date).getTime()) / 1000);
            if (isNaN(seconds)) return '';
            if (seconds < 60) return 'now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)}d`;
            return new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        // ============ API Service ============
        class ApiService {
            constructor(baseUrl, anonKey) {
                this.baseUrl = baseUrl;

            getHeaders() {
                return {
                    'apikey': this.anonKey,
                    'Authorization': `Bearer ${this.anonKey}`,
                    'Content-Type': 'application/json'
                };
            }

            async request(endpoint, options = {}) {
                const url = `${this.baseUrl}${endpoint}`;
                const config = {
                    headers: this.getHeaders(),
                    ...options
                };

                try {
                    const response = await fetch(url, config);
                    
                    if (!response.ok) {
                        const errorBody = await response.text();
                        throw new Error(`API Error ${response.status}: ${errorBody}`);
                    }

                    // Handle 204 No Content
                    if (response.status === 204) return null;
                    
                    return await response.json();
                } catch (error) {
                    console.error(`API Request Failed: ${endpoint}`, error);
                    throw error;
                }
            }

            async get(endpoint, params = {}) {
                const queryString = new URLSearchParams(params).toString();
                const url = queryString ? `${endpoint}?${queryString}` : endpoint;
                return this.request(url);
            }

            async post(endpoint, data) {
                return this.request(endpoint, {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: {
                        ...this.getHeaders(),
                        'Prefer': 'return=representation'
                    }
                });
            }

            async patch(endpoint, data) {
                return this.request(endpoint, {
                    method: 'PATCH',
                    body: JSON.stringify(data),
                    headers: {
                        ...this.getHeaders(),
                        'Prefer': 'return=minimal'
                    }
                });
            }

            async delete(endpoint) {
                return this.request(endpoint, {
                    method: 'DELETE',
                    headers: {
                        ...this.getHeaders(),
                        'Prefer': 'return=minimal'
                    }
                });
            }

            // Cache management
            getCached(key) {
                const cached = this.cache.get(key);
                if (cached && Date.now() - cached.timestamp < this.cacheTimeout) {
                    return cached.data;
                }
                this.cache.delete(key);
                return null;
            }

            setCache(key, data) {
                this.cache.set(key, { data, timestamp: Date.now() });
            }

            clearCache() {
                this.cache.clear();
            }

                const oldValue = this.state[key];
                this.state[key] = value;
                this.notify(key, value, oldValue);

            subscribe(key, callback) {
                if (!this.listeners.has(key)) {
                    this.listeners.set(key, new Set());
                }
                this.listeners.get(key).add(callback);
                
                // Return unsubscribe function
                return () => {
                    this.listeners.get(key)?.delete(callback);
                };
            }

            notify(key, newValue, oldValue) {
                this.listeners.get(key)?.forEach(callback => {
                    try {
                        callback(newValue, oldValue);
                    } catch (error) {
                        console.error(`State listener error for ${key}:`, error);
                    }
                });
            }

                // Update meta theme-color

                this.updateToggleUI(next);

                try {
                    const users = await api.get(`/rest/v1/users`, { id: `eq.${uid}`, limit: 1 });

                    if (profile) {
                        state.get('profiles').set(uid, profile);
                    }
                    
                    return profile;
                } catch (error) {
                    console.error('Failed to fetch profile:', error);
                    return null;
                }
            }

            async getProfilesBatch(uids) {
                if (!uids.length) return {};
                
                const uniqueUids = [...new Set(uids)];
                const profiles = {};
                const toFetch = [];

                // Check cache
                uniqueUids.forEach(uid => {
                    const cached = state.get('profiles').get(uid);
                    if (cached) {
                        profiles[uid] = cached;
                    } else {
                        toFetch.push(uid);
                    }
                });

                // Batch fetch remaining
                if (toFetch.length) {
                    try {
                        const fetched = await api.get('/rest/v1/users', {
                            id: `in.(${toFetch.join(',')})`
                        });
                        
                        fetched.forEach(profile => {

                        });
                    } catch (error) {
                        console.error('Failed to batch fetch profiles:', error);
                    }
                }

                return profiles;

                    const posts = postsResponse || [];
                    const reproclaims = reproclaimsResponse || [];
                    
                    // Build feed items
                    const items = [];
                    const postMap = new Map();
                    
                    posts.forEach(post => {
                        postMap.set(post.id, post);
                        items.push({ type: 'post', data: post, time: post.created_at });
                    });

                    // Add reproclaims
                    for (const repro of reproclaims) {
                        if (postMap.has(repro.post_id)) {
                            items.push({
                                type: 'repro',
                                data: { ...postMap.get(repro.post_id), repro_by: repro.user_id, repro_at: repro.created_at },
                                time: repro.created_at
                            });
                        }
                    }

                    // Sort by time
                    items.sort((a, b) => new Date(b.time) - new Date(a.time));
                    
                    return items.slice(0, CONFIG.FEED_PAGE_SIZE);
                } catch (error) {
                    console.error('Failed to load feed:', error);
                    throw error;
                }
            }

        class PostActionsService {
            async toggleSpac(postId, userId, button) {
                if (!userId) {
                    Toast.error('Sign in first');
                    return;
                }

                const isActive = button.getAttribute('aria-pressed') === 'true';
                const countElement = button.querySelector('.cnt');
                let count = parseInt(countElement.textContent) || 0;

                try {
                    if (isActive) {
                        // Remove reaction
                        button.setAttribute('aria-pressed', 'false');
                        button.classList.remove('on');
                        countElement.textContent = Math.max(0, count - 1);
                        
                        await api.delete(`/rest/v1/reactions?post_id=eq.${postId}&user_id=eq.${userId}&reaction_type=eq.spac`);
                    } else {
                        // Add reaction
                        button.setAttribute('aria-pressed', 'true');
                        button.classList.add('on');
                        countElement.textContent = count + 1;
                        
                        // Animate icon
                        const icon = button.querySelector('.pi-icon');
                        if (icon) {
                            icon.style.transform = 'scale(1.4)';
                            setTimeout(() => icon.style.transform = 'scale(1)', 200);
                        }

                        await api.post('/rest/v1/reactions', {
                            post_id: postId,
                            user_id: userId,
                            reaction_type: 'spac',
                            created_at: new Date().toISOString()
                        });
                    }
                } catch (error) {
                    // Revert on error
                    button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                    button.classList.toggle('on', isActive);
                    countElement.textContent = count;
                    Toast.error('Failed to update reaction');
                }
            }

            async reproclaim(postId, userId, button) {
                if (!userId) {
                    Toast.error('Sign in first');
                    return;
                }

                try {
                    // Check if already reproclaimed
                    const existing = await api.get('/rest/v1/reproclaims', {
                        user_id: `eq.${userId}`,
                        post_id: `eq.${postId}`,
                        limit: 1
                    });

                    if (existing && existing.length > 0) {
                        Toast.show('Already reproclaimed');
                        return;
                    }

                    await api.post('/rest/v1/reproclaims', {
                        user_id: userId,
                        post_id: postId,
                        created_at: new Date().toISOString()
                    });

                    const countElement = button.querySelector('.cnt');
                    countElement.textContent = (parseInt(countElement.textContent) || 0) + 1;
                    
                    Toast.success('Reproclaimed! 🔄');
                } catch (error) {
                    Toast.error('Failed to reproclaim');
                }
            }

            async sharePost(postId, button) {
                const url = `${location.origin}/post/${postId}`;
                let shared = false;

                try {
                    if (navigator.share) {
                        await navigator.share({ title: 'SPACchat', url });
                        shared = true;
                    }
                } catch (error) {
                    // User cancelled or not supported
                }

                if (!shared) {
                    try {
                        await navigator.clipboard.writeText(url);
                        Toast.success('Link copied! 📤');
                        shared = true;
                    } catch (error) {
                        Toast.error('Failed to share');
                        return;
                    }
                }

                if (shared) {
                    const countElement = button.querySelector('.cnt');
                    const newCount = (parseInt(countElement.textContent) || 0) + 1;
                    countElement.textContent = newCount;

                    await api.patch(`/rest/v1/posts?id=eq.${postId}`, {
                        share_count: newCount
                    });
                }
            }

            async toggleSave(postId, userId, button) {
                if (!userId) {
                    Toast.error('Sign in first');
                    return;
                }

                const isSaved = button.classList.contains('svd');
                const icon = button.querySelector('.pi-icon');

                try {
                    if (isSaved) {
                        button.classList.remove('svd');
                        icon.textContent = '🔖';
                        
                        await api.delete(`/rest/v1/saved_posts?user_id=eq.${userId}&post_id=eq.${postId}`);
                        Toast.success('Removed from saved');
                    } else {
                        button.classList.add('svd');
                        icon.textContent = '🔖✓';
                        
                        await api.post('/rest/v1/saved_posts', {
                            user_id: userId,
                            post_id: postId,
                            collection: 'default',
                            created_at: new Date().toISOString()
                        });

                    }
                } catch (error) {
                    Toast.error('Failed to update save status');
                }
            }

        // ============ Media Upload Service ============
        class MediaUploadService {
            validateFile(file, type) {
                const maxSize = CONFIG.MAX_FILE_SIZE_MB * 1024 * 1024;
                
                if (file.size > maxSize) {
                    throw new Error(`File too large. Maximum size is ${CONFIG.MAX_FILE_SIZE_MB}MB`);
                }

                if (type === 'image' && !file.type.startsWith('image/')) {
                    throw new Error('Invalid image file');
                }

                if (type === 'video' && !file.type.startsWith('video/')) {
                    throw new Error('Invalid video file');
                }

                return true;
            }

            async uploadToCloudinary(file, type = 'image') {
                try {
                    this.validateFile(file, type);

                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
                    formData.append('cloud_name', CONFIG.CLOUDINARY_CLOUD);

                    if (type === 'video') {
                        formData.append('resource_type', 'video');
                    }

                    const response = await fetch(
                        `https://api.cloudinary.com/v1_1/${CONFIG.CLOUDINARY_CLOUD}/${type}/upload`,
                        { method: 'POST', body: formData }
                    );

                    if (!response.ok) {
                        throw new Error('Upload failed');
                    }

                    const data = await response.json();
                    return data.secure_url;
                } catch (error) {
                    console.error('Upload error:', error);
                    throw error;
                }
            }

            async uploadMultipleFiles(files, type) {
                const urls = [];
                const errors = [];

                for (const file of files) {
                    try {
                        const url = await this.uploadToCloudinary(file, type);
                        urls.push({ url, type: file.type, name: file.name });
                    } catch (error) {
                        errors.push({ file: file.name, error: error.message });
                    }
                }

                return { urls, errors };
            }
        }

            createPostCard(post, type, index, profiles, userReactions, userSavedPosts) {
                const card = document.createElement('article');
                card.className = 'post';
                card.style.animationDelay = `${index * 0.02}s`;
                card.setAttribute('data-pid', post.id);
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', `Post by ${profiles[post.user_id]?.full_name || 'User'}`);

                const profile = profiles[post.user_id];
                const reproProfile = post.repro_by ? profiles[post.repro_by] : null;
                const displayName = profile?.full_name || profile?.username || 'User';
                const hasMedia = post.media_urls && post.media_urls.length > 0;
                const isLong = post.content && post.content.length > 200;

                let mediaHTML = '';
                if (hasMedia) {
                    if (post.post_type === 'video' || post.media_urls.some(u => u.match(/\.(mp4|webm|mov)/i))) {
                        mediaHTML = post.media_urls.map(url => 
                            url.match(/\.(mp4|webm|mov)/i)
                                ? `<video class="pimg" controls preload="metadata" style="max-height:300px" aria-label="Video content">
                                     <source src="${escapeHtml(url)}" type="video/mp4">
                                   </video>`
                                : `<img class="pimg" src="${escapeHtml(url)}" loading="lazy" alt="Post image" onclick="window.open('${escapeHtml(url)}','_blank')">`
                        ).join('');
                    } else {
                        const gridClass = post.media_urls.length === 1 ? 'g1' : 
                                         post.media_urls.length === 2 ? 'g2' : 
                                         post.media_urls.length === 3 ? 'g3' : 'g4';
                        mediaHTML = `<div class="pimgs ${gridClass}">
                            ${post.media_urls.map(url => 
                                `<img class="pimg" src="${escapeHtml(url)}" loading="lazy" alt="Post image" onclick="window.open('${escapeHtml(url)}','_blank')">`
                            ).join('')}
                        </div>`;
                    }

                if (post.post_type === 'voice' && post.media_urls && post.media_urls[0]) {
                    mediaHTML = `<div class="pvoice">
                        <audio controls src="${escapeHtml(post.media_urls[0])}" aria-label="Voice note"></audio>

                let reproHTML = '';
                if (type === 'repro' && reproProfile) {

                            <span class="cnt">${post.spac_count || 0}</span>
                        </button>

                            <span class="pi-icon" aria-hidden="true">💬</span>

            renderStories(stories, currentUserId, profiles) {
                const storiesRow = $('storiesRow');
                if (!storiesRow) return;

                storiesRow.innerHTML = '';

                // My story button
                const myBtn = document.createElement('button');
                myBtn.className = 'si';
                myBtn.setAttribute('role', 'listitem');
                const currentProfile = state.get('currentProfile');
                myBtn.innerHTML = `

                storiesRow.appendChild(myBtn);

                // Group stories by user
                const grouped = {};
                stories.forEach(story => {
                    if (!grouped[story.user_id]) grouped[story.user_id] = [];
                    grouped[story.user_id].push(story);
                });

                // Render other users' stories
                for (const uid in grouped) {
                    if (uid === currentUserId) continue;
                    
                    const profile = profiles[uid];
                    const name = profile?.full_name || profile?.username || uid.substring(0, 6) || 'User';
                    
                    const btn = document.createElement('button');
                    btn.className = 'si';

                        <div class="sr">

            openStoryCreate() {
                state.set('storyMedia', null);
                $('storyPreview').innerHTML = '';
                this.openModal('storyModal');

            viewUserStories(uid, stories, name) {
                state.set('storyIndex', 0);
                this.currentStorySet = stories;
                this.currentStoryUser = uid;
                
                this.openModal('storyViewer');
                this.showStory();
                this.renderStoryDots(stories);
            }

            showStory() {
                const stories = this.currentStorySet;
                const index = state.get('storyIndex');
                
                if (!stories || !stories[index]) return;

                const story = stories[index];
                const content = $('storyContent');
                
                if (story.media_url) {
                    if (story.media_url.match(/\.(mp4|webm|mov)/i)) {
                        content.innerHTML = `<video src="${escapeHtml(story.media_url)}" autoplay playsinline 
                            style="max-width:100%;max-height:80vh" onended="window._nextStory()" aria-label="Video story"></video>`;
                    } else {
                        content.innerHTML = `<img src="${escapeHtml(story.media_url)}" 
                            style="max-width:100%;max-height:80vh;object-fit:contain" alt="Story image">`;
                    }
                } else if (story.content) {
                    content.innerHTML = `<p style="color:#fff;font-size:18px">${escapeHtml(story.content)}</p>`;
                }

                this.updateStoryDots();

                // Auto-advance for non-video stories
                if (!story.media_url?.match(/\.(mp4|webm|mov)/i)) {
                    clearTimeout(this._storyTimeout);
                    this._storyTimeout = setTimeout(() => window._nextStory(), CONFIG.STORY_DURATION_MS);
                }
            }

            renderStoryDots(stories) {
                const nav = $('storyNav');
                nav.innerHTML = stories.map((_, i) => 
                    `<button class="story-dot${i === 0 ? ' active' : ''}" 
                        data-si="${i}" 
                        aria-label="Story ${i + 1}"
                        role="tab"
                        aria-selected="${i === 0}">
                    </button>`
                ).join('');

                nav.querySelectorAll('.story-dot').forEach(dot => {
                    dot.addEventListener('click', (e) => {
                        state.set('storyIndex', parseInt(e.target.dataset.si));
                        this.showStory();
                    });
                });
            }

            updateStoryDots() {
                const dots = $$('.story-dot', $('storyNav'));
                dots.forEach((dot, i) => {
                    const isActive = i === state.get('storyIndex');
                    dot.classList.toggle('active', isActive);
                    dot.setAttribute('aria-selected', isActive);
                });
            }

            openModal(modalId) {
                const modal = $(modalId);
                if (modal) {
                    modal.setAttribute('aria-hidden', 'false');
                    modal.classList.add('on');
                    
                    // Focus first focusable element
                    setTimeout(() => {
                        const focusable = modal.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
                        if (focusable) focusable.focus();
                    }, 100);
                }
            }

            closeModal(modalId) {
                const modal = $(modalId);
                if (modal) {
                    modal.setAttribute('aria-hidden', 'true');
                    modal.classList.remove('on');
                }
            }

            closeAllModals() {
                $$('.modal-overlay').forEach(modal => {
                    this.closeModal(modal.id);
                });
                
                const storyViewer = $('storyViewer');
                if (storyViewer) {
                    storyViewer.setAttribute('aria-hidden', 'true');
                    storyViewer.classList.remove('on');
                }
                
                clearTimeout(this._storyTimeout);
            }
        }

                // Modal overlay clicks
                $$('.modal-overlay').forEach(modal => {
                    modal.addEventListener('click', (e) => {
                        if (e.target === modal) ui.closeModal(modal.id);
                    });
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        ui.closeAllModals();
                    }
                });

                // Settings modal overlay
                $('settingsModal')?.addEventListener('click', (e) => {
                    if (e.target === $('settingsModal')) ui.closeModal('settingsModal');
                });

                // Next story handler
                window._nextStory = () => {
                    const stories = ui.currentStorySet;
                    if (!stories) return;
                    
                    const nextIndex = state.get('storyIndex') + 1;
                    if (nextIndex >= stories.length) {
                        ui.closeModal('storyViewer');
                        clearTimeout(ui._storyTimeout);
                    } else {
                        state.set('storyIndex', nextIndex);
                        ui.showStory();
                    }
                };

                // Remove media handler
                window._rmMedia = (index) => {
                    const media = state.get('uploadMedia');
                    media.splice(index, 1);
                    state.set('uploadMedia', media);
                    this.renderMediaPreviews();
                };
            }

            async handleFeedClick(e) {
                const btn = e.target.closest('button:not([data-action])');
                if (!btn) return;

                const postId = btn.getAttribute('data-pid');
                if (!postId) return;

                const userId = state.get('currentUser')?.uid;

                if (btn.classList.contains('sb')) {
                    await postActions.toggleSpac(postId, userId, btn);
                } else if (btn.classList.contains('cb')) {
                    await this.openContributions(postId);
                } else if (btn.classList.contains('rb')) {
                    await postActions.reproclaim(postId, userId, btn);
                    // Refresh feed after delay
                    setTimeout(() => this.loadFeed(), 600);
                } else if (btn.classList.contains('shb')) {
                    await postActions.sharePost(postId, btn);
                } else if (btn.classList.contains('svb')) {
                    await postActions.toggleSave(postId, userId, btn);
                }
            }

            toggleReadMore(btn) {
                const postId = btn.dataset.pid;
                const body = $(`body-${postId}`);
                if (!body) return;

                const isTruncated = body.classList.contains('trunc');
                body.classList.toggle('trunc');
                btn.textContent = isTruncated ? 'Read less' : 'Read more';
                btn.setAttribute('aria-expanded', isTruncated);
            }

            openCreatePost() {
                state.set('uploadMedia', []);
                state.set('uploadVoice', null);
                $('mediaPreview').innerHTML = '';
                $('voicePreview').style.display = 'none';
                $('voicePreview').innerHTML = '';
                $('postContent').value = '';
                
                ui.openModal('postModal');
                setTimeout(() => $('postContent')?.focus(), 400);
            }

            async handleMediaInput(input, type) {
                const files = Array.from(input.files);
                const currentMedia = state.get('uploadMedia');

                if (currentMedia.length + files.length > CONFIG.MAX_MEDIA_FILES) {
                    Toast.error(`Maximum ${CONFIG.MAX_MEDIA_FILES} files allowed`);
                    input.value = '';
                    return;
                }

                try {
                    const { urls, errors } = await mediaUpload.uploadMultipleFiles(files, type);
                    
                    if (errors.length) {
                        Toast.error(`${errors.length} file(s) failed to upload`);
                    }

                    const newMedia = [...currentMedia, ...urls];
                    state.set('uploadMedia', newMedia);
                    this.renderMediaPreviews();
                } catch (error) {
                    Toast.error('Upload failed');
                }

                input.value = '';
            }

            async handleDocInput(input) {
                const files = Array.from(input.files);
                const currentMedia = state.get('uploadMedia');

                for (const file of files) {
                    try {
                        const url = await mediaUpload.uploadToCloudinary(file, 'raw');
                        currentMedia.push({ url, type: 'doc', name: file.name });
                    } catch (error) {
                        Toast.error(`Failed to upload ${file.name}`);
                    }
                }

                state.set('uploadMedia', currentMedia);
                this.renderMediaPreviews();
                input.value = '';
            }

            async recordVoice() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    const chunks = [];

                    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        try {
                            const url = await mediaUpload.uploadToCloudinary(
                                new File([blob], 'voice.webm', { type: 'audio/webm' }),
                                'video'
                            );
                            
                            if (url) {
                                state.set('uploadVoice', url);
                                $('voicePreview').style.display = 'flex';
                                $('voicePreview').innerHTML = `
                                    <span>🎤 Voice note recorded</span>
                                    <audio controls src="${escapeHtml(url)}" style="width:100%;height:28px" aria-label="Voice note preview"></audio>`;
                            }
                        } catch (error) {
                            Toast.error('Failed to upload voice note');
                        }
                        
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    Toast.show('Recording... Speak now (max 60s)');
                    
                    $('voicePreview').style.display = 'flex';
                    $('voicePreview').innerHTML = '<span style="color:var(--err)">🔴 Recording...</span>';

                    // Auto-stop after 60 seconds
                    setTimeout(() => {
                        if (mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                    }, 60000);

                } catch (error) {
                    Toast.error('Microphone access denied');
                }
            }

            renderMediaPreviews() {
                const media = state.get('uploadMedia');
                const preview = $('mediaPreview');
                
                preview.innerHTML = media.map((m, i) => `
                    <div class="preview-item">
                        ${m.type.startsWith('video/') 
                            ? `<video src="${escapeHtml(m.url)}" preload="metadata"></video>`
                            : m.type === 'doc'
                                ? `<span style="font-size:24px">📄</span>`
                                : `<img src="${escapeHtml(m.url)}" alt="Upload preview">`
                        }
                        <button class="rm-btn" onclick="window._rmMedia(${i})" aria-label="Remove media">✕</button>
                    </div>
                `).join('');
            }

            async handleStoryMediaInput(input, type) {
                const file = input.files[0];
                if (!file) return;

                $('storyPreview').innerHTML = '<p style="color:var(--tm);font-size:12px;">Uploading...</p>';

                try {
                    const url = await mediaUpload.uploadToCloudinary(file, type);
                    
                    if (url) {
                        state.set('storyMedia', { url, type });
                        $('storyPreview').innerHTML = type === 'video'
                            ? `<video src="${escapeHtml(url)}" controls style="max-width:100%;max-height:200px" aria-label="Story preview"></video>`
                            : `<img src="${escapeHtml(url)}" style="max-width:100%;max-height:200px;border-radius:10px" alt="Story preview">`;
                    }
                } catch (error) {
                    $('storyPreview').innerHTML = '<p style="color:var(--err)">Upload failed</p>';
                }

                input.value = '';
            }

            async submitPost() {
                const content = $('postContent').value.trim();
                const media = state.get('uploadMedia');
                const voice = state.get('uploadVoice');
                const user = state.get('currentUser');

                if (!content && !media.length && !voice) {
                    Toast.error('Add content or media');
                    return;
                }

                if (!user) {
                    Toast.error('Sign in first');
                    return;
                }

                const btn = $('submitPost');
                btn.disabled = true;
                btn.textContent = 'Proclaiming...';

                try {
                    const now = new Date().toISOString();
                    const postData = {
                        user_id: user.uid,
                        content: content || '',
                        post_status: 'published',
                        created_at: now,
                        updated_at: now
                    };

                    if (voice) {
                        postData.post_type = 'voice';
                        postData.media_urls = [voice];
                    } else if (media.length) {
                        const hasVideo = media.some(m => m.type.startsWith('video/'));
                        postData.post_type = hasVideo ? 'video' : 'image';
                        postData.media_urls = media.map(m => m.url);
                    } else {
                        postData.post_type = 'text';
                    }

                    await api.post('/rest/v1/posts', postData);
                    
                    ui.closeModal('postModal');
                    await this.loadFeed();
                    Toast.success('Proclaimed! 🔥');
                } catch (error) {
                    Toast.error('Failed to post. Please try again.');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Proclaim 🔥';
                }
            }

            async openContributions(postId) {
                state.set('activePostId', postId);
                $('contribList').innerHTML = '<p style="color:var(--tm);text-align:center;padding:8px;">Loading...</p>';
                $('contribInput').value = '';
                
                ui.openModal('contribModal');

                try {
                    const contributions = await api.get('/rest/v1/contributions', {
                        post_id: `eq.${postId}`,
                        order: 'created_at.asc',
                        limit: 100
                    });

                    if (!contributions.length) {
                        $('contribList').innerHTML = '<p style="color:var(--tm);text-align:center;padding:16px;">No contributions yet.</p>';
                    } else {
                        $('contribList').innerHTML = contributions.map(c => `
                            <div class="contrib-item" role="listitem">
                                <div class="contrib-av" aria-hidden="true">${getInitials(c.user_id?.substring(0,8) || 'U')}</div>
                                <div class="contrib-body">
                                    <div class="contrib-name">@${escapeHtml(c.user_id?.substring(0,8) || 'user')}</div>
                                    <div class="contrib-text">${escapeHtml(c.content)}</div>
                                    <div class="contrib-time">${timeAgo(c.created_at)}</div>
                                    <div class="contrib-acts">
                                        <button class="contrib-act" aria-label="Like contribution">🔥 Like</button>
                                        <button class="contrib-act" aria-label="Reply to contribution">💬 Reply</button>
                                    </div>
                                </div>
                            </div>
                        `).join('');
                    }
                } catch (error) {
                    $('contribList').innerHTML = '<p style="color:var(--err);text-align:center;">Failed to load contributions</p>';
                }
            }

            async submitContribution() {
                const text = $('contribInput').value.trim();
                const user = state.get('currentUser');
                const postId = state.get('activePostId');

                if (!text) {
                    Toast.error('Write something');
                    return;
                }

                if (!user || !postId) return;

                try {
                    await api.post('/rest/v1/contributions', {
                        post_id: postId,
                        user_id: user.uid,
                        content: text,
                        created_at: new Date().toISOString()
                    });

                    Toast.success('Contribution added!');
                    
                    // Refresh contributions
                    await this.openContributions(postId);
                    
                    // Update contribution count in feed
                    const countElement = document.querySelector(`.cb[data-pid="${postId}"] .cnt`);
                    if (countElement) {
                        countElement.textContent = (parseInt(countElement.textContent) || 0) + 1;
                    }
                } catch (error) {
                    Toast.error('Failed to add contribution');
                }
            }

            async submitStory() {
                const storyMedia = state.get('storyMedia');
                const user = state.get('currentUser');

                if (!storyMedia) {
                    Toast.error('Add media');
                    return;
                }

                if (!user) {
                    Toast.error('Sign in first');
                    return;
                }

                try {
                    await api.post('/rest/v1/stories', {
                        user_id: user.uid,
                        media_url: storyMedia.url,
                        story_type: storyMedia.type === 'video' ? 'video' : 'image',
                        created_at: new Date().toISOString(),
                        expires_at: new Date(Date.now() + 86400000).toISOString() // 24 hours
                    });

                    ui.closeModal('storyModal');
                    Toast.success('Story posted!');
                    await this.loadStories();
                } catch (error) {
                    Toast.error('Failed to post story');
                }
            }
        }

        // ============ Initialize Application ============
        const appController = new AppController();

        // Export for debugging
        window.appController = appController;
        window.appState = state;

        console.log('🕊️ SPACchat Home | Production Ready');
    </script>
</body>
</html>
