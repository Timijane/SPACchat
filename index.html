<!DOCTYPE html>
<html>
<head>
  <title>SPAC Login</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
    }

    input {
      padding: 12px;
      margin: 8px;
      width: 250px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    #status {
      margin-top: 20px;
      color: #38bdf8;
    }

    h2 {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<h2>SPAC Login</h2>

<input id="phone" placeholder="+2348012345678" />

<div id="recaptcha-container"></div>

<button onclick="sendOTP()">Send OTP</button>

<br>

<input id="otp" placeholder="Enter OTP" />

<button onclick="verifyOTP()">Verify OTP</button>

<p id="status"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCo6bD1yB9SHG4Iem-MhniQ4YyOEQv-_YA",
  authDomain: "spacchat-e35b8.firebaseapp.com",
  projectId: "spacchat-e35b8",
  storageBucket: "spacchat-e35b8.firebasestorage.app",
  messagingSenderId: "407081887262",
  appId: "1:407081887262:web:62879d6d38f6482982700f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let confirmationResult;

// IMPORTANT FIX (correct Recaptcha init)
window.recaptchaVerifier = new RecaptchaVerifier(
  auth,
  "recaptcha-container",
  {
    size: "normal"
  }
);

window.recaptchaVerifier.render();

window.sendOTP = async function () {
  const phoneNumber = document.getElementById("phone").value;

  try {
    confirmationResult = await signInWithPhoneNumber(
      auth,
      phoneNumber,
      window.recaptchaVerifier
    );

    document.getElementById("status").innerText =
      "OTP sent ✔ Check SMS";

  } catch (error) {
    console.log(error);
    document.getElementById("status").innerText =
      "OTP failed ❌ Check console";
  }
};

window.verifyOTP = async function () {
  const code = document.getElementById("otp").value;

  try {
    const result = await confirmationResult.confirm(code);

    document.getElementById("status").innerText =
      "Login success ✔ UID: " + result.user.uid;

  } catch (error) {
    document.getElementById("status").innerText =
      "Invalid OTP ❌";
  }
};

</script>

</body>
</html>
