<!DOCTYPE html>
<html>
<head>
  <title>SPAC - Welcome</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      width: 340px;
      background: #0b1220;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #111827;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .toggle {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #38bdf8;
      cursor: pointer;
    }

    .eye {
      float: right;
      margin-top: -38px;
      margin-right: 10px;
      cursor: pointer;
      font-size: 14px;
      color: #9ca3af;
    }

    #status {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      color: #38bdf8;
    }
  </style>
</head>

<body>

<div class="card">

  <h2 id="title">SPAC Sign Up</h2>

  <input id="email" placeholder="Email" />
  
  <input id="password" type="password" placeholder="Password" />
  <div class="eye" onclick="togglePass()">👁</div>

  <button onclick="handleAuth()" id="btn">Create Account</button>

  <div class="toggle" onclick="switchMode()">
    Already have an account? Login
  </div>

  <div id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCo6bD1yB9SHG4Iem-MhniQ4YyOEQv-_YA",
  authDomain: "spacchat-e35b8.firebaseapp.com",
  projectId: "spacchat-e35b8",
  storageBucket: "spacchat-e35b8.firebasestorage.app",
  messagingSenderId: "407081887262",
  appId: "1:407081887262:web:62879d6d38f6482982700f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let isLogin = false;

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

window.switchMode = function () {
  isLogin = !isLogin;

  document.getElementById("title").innerText = isLogin ? "SPAC Login" : "SPAC Sign Up";
  document.getElementById("btn").innerText = isLogin ? "Login" : "Create Account";

  document.querySelector(".toggle").innerText =
    isLogin ? "Don't have an account? Sign up" : "Already have an account? Login";

  setStatus("");
};

window.handleAuth = async function () {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {

    if (!isLogin) {
      const user = await createUserWithEmailAndPassword(auth, email, password);
      setStatus("Account created ✔ " + user.user.email);
    } else {
      const user = await signInWithEmailAndPassword(auth, email, password);
      setStatus("Login successful ✔ " + user.user.email);
    }

  } catch (e) {
    setStatus("Error ❌ " + e.message);
  }
};

window.togglePass = function () {
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
};

</script>

</body>
</html>
