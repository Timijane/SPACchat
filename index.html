<!DOCTYPE html>
<html>
<head>
  <title>SPAC Auth</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px;
    }

    .box {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .toggle {
      margin-top: -35px;
      margin-left: 250px;
      cursor: pointer;
      font-size: 14px;
      color: #38bdf8;
      position: relative;
    }

    #status {
      margin-top: 15px;
      font-size: 13px;
      color: #38bdf8;
      text-align: center;
    }

    .switch {
      margin-top: 10px;
      font-size: 13px;
      color: #9ca3af;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>

<body>

<h2>SPAC Login</h2>

<div class="box">

  <input id="email" placeholder="Email" />

  <div style="position: relative;">
    <input id="password" type="password" placeholder="Password" />
    <span class="toggle" onclick="togglePassword()">👁</span>
  </div>

  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>

  <div class="switch" onclick="switchMode()">
    Switch mode (Sign up / Login)
  </div>

  <p id="status"></p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCo6bD1yB9SHG4Iem-MhniQ4YyOEQv-_YA",
  authDomain: "spacchat-e35b8.firebaseapp.com",
  projectId: "spacchat-e35b8",
  storageBucket: "spacchat-e35b8.firebasestorage.app",
  messagingSenderId: "407081887262",
  appId: "1:407081887262:web:62879d6d38f6482982700f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let isLogin = false;

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

window.signup = async function () {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const user = await createUserWithEmailAndPassword(auth, email, password);
    setStatus("Signup success ✔ " + user.user.email);
  } catch (e) {
    setStatus("Signup error ❌ " + e.message);
  }
};

window.login = async function () {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const user = await signInWithEmailAndPassword(auth, email, password);
    setStatus("Login success ✔ " + user.user.email);
  } catch (e) {
    setStatus("Login error ❌ " + e.message);
  }
};

window.togglePassword = function () {
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
};

window.switchMode = function () {
  isLogin = !isLogin;
  setStatus(isLogin ? "Login mode" : "Signup mode");
};

</script>

</body>
</html>
