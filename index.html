<!DOCTYPE html>
<html>
<head>
  <title>SPAC Login Debug</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
    }

    input {
      padding: 12px;
      margin: 8px;
      width: 260px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 18px;
      margin: 6px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    #status {
      margin-top: 20px;
      color: #38bdf8;
      width: 80%;
      text-align: center;
      font-size: 14px;
    }

    #debug {
      margin-top: 15px;
      color: #f87171;
      font-size: 12px;
      white-space: pre-wrap;
      width: 80%;
      text-align: center;
    }
  </style>
</head>

<body>

<h2>SPAC Login (Debug Mode)</h2>

<input id="phone" placeholder="+2348012345678" />
<div id="recaptcha-container"></div>

<button onclick="sendOTP()">Send OTP</button>

<br>

<input id="otp" placeholder="Enter OTP" />
<button onclick="verifyOTP()">Verify OTP</button>

<p id="status">Status: Waiting...</p>
<pre id="debug"></pre>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// ================= FIREBASE CONFIG =================
const firebaseConfig = {
  apiKey: "AIzaSyCo6bD1yB9SHG4Iem-MhniQ4YyOEQv-_YA",
  authDomain: "spacchat-e35b8.firebaseapp.com",
  projectId: "spacchat-e35b8",
  storageBucket: "spacchat-e35b8.firebasestorage.app",
  messagingSenderId: "407081887262",
  appId: "1:407081887262:web:62879d6d38f6482982700f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let confirmationResult;

// ================= DEBUG LOGGER =================
function debug(msg) {
  console.log(msg);
  document.getElementById("debug").innerText += msg + "\n";
}

function setStatus(msg) {
  document.getElementById("status").innerText = "Status: " + msg;
}

// ================= INIT RECAPTCHA =================
try {
  window.recaptchaVerifier = new RecaptchaVerifier(
    auth,
    "recaptcha-container",
    {
      size: "normal",
      callback: () => debug("reCAPTCHA solved"),
      "expired-callback": () => debug("reCAPTCHA expired")
    }
  );

  window.recaptchaVerifier.render()
    .then(() => debug("reCAPTCHA rendered"))
    .catch(err => debug("reCAPTCHA error: " + err));

} catch (e) {
  debug("Recaptcha init failed: " + e);
}

// ================= SEND OTP =================
window.sendOTP = async function () {

  const phoneNumber = document.getElementById("phone").value;

  debug("Sending OTP to: " + phoneNumber);

  if (!phoneNumber.startsWith("+")) {
    setStatus("Invalid phone format");
    debug("ERROR: Phone must include country code (+234...)");
    return;
  }

  try {
    confirmationResult = await signInWithPhoneNumber(
      auth,
      phoneNumber,
      window.recaptchaVerifier
    );

    setStatus("OTP sent successfully");
    debug("OTP sent successfully");

  } catch (error) {
    setStatus("OTP failed");
    debug("OTP ERROR: " + error.code);
    debug(error.message);
  }
};

// ================= VERIFY OTP =================
window.verifyOTP = async function () {

  const code = document.getElementById("otp").value;

  debug("Verifying OTP: " + code);

  try {
    const result = await confirmationResult.confirm(code);

    const user = result.user;

    setStatus("Login successful ✔ UID: " + user.uid);
    debug("LOGIN SUCCESS UID: " + user.uid);

  } catch (error) {
    setStatus("Invalid OTP");
    debug("VERIFY ERROR: " + error.code);
    debug(error.message);
  }
};

</script>

</body>
</html>
