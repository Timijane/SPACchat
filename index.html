<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SPACchat — Connect in the Spirit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5B3C88; --primary-light: #7B5CA8; --primary-glow: rgba(91,60,136,0.2);
            --secondary: #FF7A59; --secondary-glow: rgba(255,122,89,0.25);
            --background: #F7F3EC; --background-alt: #EDE8DF;
            --card: #FFFFFF; --text: #2E2E2E; --text-secondary: #5A5560;
            --text-muted: #8B8690; --accent: #2BB3C0; --success: #2EAD67;
            --error: #E74C3C; --border: #E0DCD5;
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
            --radius-sm: 10px; --radius-lg: 24px;
            --brand-gradient: linear-gradient(135deg, #5B3C88 0%, #7B5CA8 30%, #FF7A59 70%, #2BB3C0 100%);
        }
        [data-theme="dark"] {
            --background: #1A1625; --background-alt: #211D30; --card: #282238;
            --text: #F0EDF5; --text-secondary: #B8B2C4; --text-muted: #7B7590;
            --border: #3A3450;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background); color: var(--text);
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            -webkit-font-smoothing: antialiased; padding: 20px;
            transition: background 0.4s ease, color 0.4s ease;
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(91,60,136,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, rgba(255,122,89,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(43,179,192,0.03) 0%, transparent 60%);
        }
        #lazy-loader {
            position: fixed; inset: 0; z-index: 9999; background: var(--background);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #lazy-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-logo {
            width: 64px; height: 64px; border-radius: 18px;
            background: var(--brand-gradient);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 900; color: #fff;
            box-shadow: 0 8px 32px var(--primary-glow);
            animation: breathe 2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .loader-text { color: var(--text-muted); font-size: 13px; font-weight: 500; letter-spacing: 1px; }
        #app {
            width: 100%; max-width: 420px;
            opacity: 0; transform: translateY(16px);
            transition: opacity 0.6s ease 0.4s, transform 0.6s ease 0.4s;
        }
        #app.visible { opacity: 1; transform: translateY(0); }
        .auth-card {
            background: var(--card); border-radius: var(--radius-lg);
            padding: 36px 28px 32px; box-shadow: var(--shadow-lg);
            border: 1px solid var(--border); position: relative; overflow: hidden;
            transition: all 0.4s ease;
        }
        .auth-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: var(--brand-gradient); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }
        .brand-area { text-align: center; margin-bottom: 28px; position: relative; z-index: 1; }
        .logo-icon {
            width: 60px; height: 60px; border-radius: 16px;
            background: var(--primary); display: inline-flex; align-items: center; justify-content: center;
            font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 900; color: #fff;
            box-shadow: 0 8px 28px var(--primary-glow); margin-bottom: 10px;
        }
        .brand-name { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; color: var(--primary); }
        .brand-name span { color: var(--secondary); }
        .brand-tagline { font-size: 12px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }
        .form-container { position: relative; z-index: 1; }
        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 5px;
        }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper input {
            width: 100%; padding: 13px 42px 13px 14px;
            background: var(--background); border: 2px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text);
            font-size: 14px; font-family: 'Inter', sans-serif;
            transition: all 0.3s ease; outline: none;
        }
        .input-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); background: var(--card); }
        .input-wrapper input.error { border-color: var(--error); background: #FFF5F5; }
        .input-wrapper input::placeholder { color: var(--text-muted); }
        .eye-btn {
            position: absolute; right: 10px; background: none; border: none;
            color: var(--text-muted); cursor: pointer; padding: 4px;
            display: flex; align-items: center; justify-content: center;
        }
        .eye-btn:hover { color: var(--primary); }
        .eye-btn svg { width: 20px; height: 20px; }
        .field-error { font-size: 11px; color: var(--error); margin-top: 4px; display: none; }
        .field-error.show { display: block; }
        .btn {
            width: 100%; padding: 14px; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif;
            cursor: pointer; border: none; transition: all 0.3s ease;
        }
        .btn-primary {
            background: var(--primary); color: #fff;
            box-shadow: 0 6px 20px var(--primary-glow); margin-top: 4px;
        }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-ghost {
            background: transparent; color: var(--accent); font-weight: 500;
            padding: 8px; margin-top: 2px; font-size: 12px;
        }
        .btn-ghost:hover { color: var(--primary); }
        .toggle-area { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-secondary); }
        .toggle-link { color: var(--secondary); font-weight: 600; cursor: pointer; margin-left: 4px; }
        .toggle-link:hover { text-decoration: underline; }
        .modal-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center; padding: 20px;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card {
            background: var(--card); border-radius: var(--radius-lg);
            padding: 28px 24px; max-width: 380px; width: 100%;
            box-shadow: var(--shadow-lg); border: 1px solid var(--border);
            position: relative; transform: translateY(20px);
            transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-close {
            position: absolute; top: 12px; right: 12px;
            width: 30px; height: 30px; border-radius: 50%;
            background: var(--background); border: 1px solid var(--border);
            color: var(--text-secondary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; transition: all 0.2s ease;
        }
        .modal-close:hover { background: var(--error); color: #fff; border-color: var(--error); }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .modal-subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
        .toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-140px);
            padding: 12px 22px; border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 600; z-index: 300;
            transition: transform 0.45s cubic-bezier(0.175,0.885,0.32,1.275);
            box-shadow: var(--shadow-lg); white-space: nowrap;
            background: var(--success); color: #fff;
        }
        .toast.error { background: var(--error); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        @media (max-width: 480px) {
            body { padding: 12px; align-items: flex-start; padding-top: 32px; }
            .auth-card { padding: 28px 20px 24px; }
        }
    </style>
</head>
<body>

    <div id="lazy-loader">
        <div class="loader-logo">S</div>
        <p class="loader-text">Loading SPACchat...</p>
    </div>

    <div class="toast" id="toast"></div>

    <div class="modal-overlay" id="resetModal">
        <div class="modal-card">
            <button class="modal-close" id="resetClose">✕</button>
            <h3 class="modal-title">Reset Password</h3>
            <p class="modal-subtitle">Enter your email to receive a password reset link.</p>
            <div class="input-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <input type="email" id="resetEmail" placeholder="you@email.com" autocomplete="email">
                </div>
                <p class="field-error" id="resetError"></p>
            </div>
            <button class="btn btn-primary" id="resetBtn">Send Reset Link</button>
        </div>
    </div>

    <div id="app">
        <div class="auth-card">
            <div class="brand-area">
                <div class="logo-icon">S</div>
                <h1 class="brand-name">SPAC<span>chat</span></h1>
                <p class="brand-tagline">Light &amp; Living</p>
            </div>
            <div class="form-container">
                <form id="authForm" novalidate>
                    <div class="input-group" id="nameGroup" style="display:none;">
                        <label>Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="fullName" placeholder="John Doe" autocomplete="name">
                        </div>
                        <p class="field-error" id="nameError"></p>
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" placeholder="you@email.com" required autocomplete="email">
                        </div>
                        <p class="field-error" id="emailError"></p>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="eye-btn" id="eyeBtn" title="Show password">
                                <svg id="eyeSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <p class="field-error" id="passwordError"></p>
                    </div>
                    <div class="input-group" id="confirmGroup" style="display:none;">
                        <label>Confirm Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
                        </div>
                        <p class="field-error" id="confirmError"></p>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span id="submitText">Sign In</span>
                    </button>
                </form>
                <button type="button" class="btn btn-ghost" id="forgotBtn">Forgot Password?</button>
            </div>
            <div class="toggle-area">
                <span id="toggleText">Don't have an account?</span>
                <span class="toggle-link" id="toggleLink">Sign Up</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCo6bD1yB9SHG4Iem-MhniQ4YyOEQv-_YA",
            authDomain: "spacchat-e35b8.firebaseapp.com",
            projectId: "spacchat-e35b8",
            storageBucket: "spacchat-e35b8.firebasestorage.app",
            messagingSenderId: "407081887262",
            appId: "1:407081887262:web:62879d6d38f6482982700f",
            measurementId: "G-T7KFRFZH7H"
        };

        const SUPABASE_URL = "https://akbwcgzymrygsjpmwysm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYndjZ3p5bXJ5Z3NqcG13eXNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTE4MjUsImV4cCI6MjA5NDg2NzgyNX0.--2SPkyKOI2aWACgib6uPUFTzLvHlocPfdRZvUeLGI4";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isSignUp = false;
        let passVisible = false;

        const loader = document.getElementById('lazy-loader');
        const appEl = document.getElementById('app');
        const nameGroup = document.getElementById('nameGroup');
        const confirmGroup = document.getElementById('confirmGroup');
        const submitText = document.getElementById('submitText');
        const toggleText = document.getElementById('toggleText');
        const toggleLink = document.getElementById('toggleLink');
        const forgotBtn = document.getElementById('forgotBtn');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');
        const resetModal = document.getElementById('resetModal');

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { loader.classList.add('hidden');
                appEl.classList.add('visible'); }, 1500);
        });
        setTimeout(() => { loader.classList.add('hidden');
            appEl.classList.add('visible'); }, 3500);

        function showToast(msg, isErr = false) {
            toast.textContent = msg;
            toast.className = 'toast' + (isErr ? ' error' : '');
            toast.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function clearErrors() {
            document.querySelectorAll('.field-error').forEach(e => { e.classList.remove('show');
                e.textContent = ''; });
            document.querySelectorAll('.input-wrapper input').forEach(i => i.classList.remove('error'));
        }

        function showError(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.classList.add('show');
            el.closest('.input-group')?.querySelector('input')?.classList.add('error');
        }

        function toggleMode() {
            isSignUp = !isSignUp;
            clearErrors();
            if (isSignUp) {
                nameGroup.style.display = 'block';
                confirmGroup.style.display = 'block';
                submitText.textContent = 'Create Account';
                toggleText.textContent = 'Already have an account?';
                toggleLink.textContent = 'Sign In';
                forgotBtn.style.display = 'none';
                document.getElementById('fullName').required = true;
                document.getElementById('confirmPassword').required = true;
            } else {
                nameGroup.style.display = 'none';
                confirmGroup.style.display = 'none';
                submitText.textContent = 'Sign In';
                toggleText.textContent = "Don't have an account?";
                toggleLink.textContent = 'Sign Up';
                forgotBtn.style.display = 'block';
                document.getElementById('fullName').required = false;
                document.getElementById('confirmPassword').required = false;
                document.getElementById('fullName').value = '';
                document.getElementById('confirmPassword').value = '';
            }
        }

        function togglePassword() {
            passVisible = !passVisible;
            const pw = document.getElementById('password');
            pw.type = passVisible ? 'text' : 'password';
            document.getElementById('eyeBtn').title = passVisible ? 'Hide password' : 'Show password';
            const svg = document.getElementById('eyeSvg');
            if (passVisible) {
                svg.innerHTML =
                    '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                svg.innerHTML =
                    '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }

        function validate() {
            clearErrors();
            let ok = true;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email) { showError('emailError', 'Email is required');
                ok = false; } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('emailError',
                'Invalid email address');
                ok = false; }
            if (!password) { showError('passwordError', 'Password is required');
                ok = false; } else if (password.length < 6) { showError('passwordError',
                'Password must be at least 6 characters');
                ok = false; }

            if (isSignUp) {
                const name = document.getElementById('fullName').value.trim();
                const confirm = document.getElementById('confirmPassword').value;
                if (!name || name.length < 2) { showError('nameError', 'Full name is required');
                    ok = false; }
                if (!confirm) { showError('confirmError', 'Please confirm password');
                    ok = false; } else if (password !== confirm) { showError('confirmError',
                    'Passwords do not match');
                    ok = false; }
            }
            return ok;
        }

        async function handleSubmit(e) {
            e.preventDefault();
            if (!validate()) return;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value.trim();

            submitBtn.disabled = true;
            submitText.textContent = isSignUp ? 'Creating Account...' : 'Signing In...';

            try {
                if (isSignUp) {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    const now = new Date().toISOString();
                    const uname = email.split('@')[0] + '_' + Math.random().toString(36).substring(2, 7);
                    await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Prefer': 'return=minimal' },
                        body: JSON.stringify({ id: cred.user.uid, email, username: uname, full_name: fullName ||
                                email.split('@')[0], created_at: now, updated_at: now,
                            onboarding_completed: !!fullName })
                    });
                    showToast('Account created! Welcome ✨');
                    setTimeout(() => { window.location.href = 'home.html'; }, 1200);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    showToast('Welcome back! 🙏');
                    setTimeout(() => { window.location.href = 'home.html'; }, 800);
                }
            } catch (err) {
                console.error('Auth error:', err.code);
                let field = null,
                    msg = 'Something went wrong.';
                switch (err.code) {
                    case 'auth/email-already-in-use':
                        field = 'emailError';
                        msg = 'Email already registered. Sign in instead.';
                        break;
                    case 'auth/invalid-email':
                        field = 'emailError';
                        msg = 'Invalid email address.';
                        break;
                    case 'auth/weak-password':
                        field = 'passwordError';
                        msg = 'Password too weak. Use 6+ characters.';
                        break;
                    case 'auth/user-not-found':
                        field = 'emailError';
                        msg = 'No account with this email.';
                        break;
                    case 'auth/wrong-password':
                        field = 'passwordError';
                        msg = 'Incorrect password.';
                        break;
                    case 'auth/invalid-credential':
                        field = 'emailError';
                        msg = 'Invalid email or password.';
                        break;
                    case 'auth/too-many-requests':
                        msg = 'Too many attempts. Wait and try again.';
                        break;
                    case 'auth/network-request-failed':
                        msg = 'Network error. Check connection.';
                        break;
                }
                if (field) showError(field, msg);
                else showToast(msg, true);
            } finally {
                submitBtn.disabled = false;
                submitText.textContent = isSignUp ? 'Create Account' : 'Sign In';
            }
        }

        function openReset() {
            document.getElementById('resetEmail').value = document.getElementById('email').value;
            document.getElementById('resetError').classList.remove('show');
            resetModal.classList.add('active');
        }

        function closeReset() { resetModal.classList.remove('active'); }

        async function sendReset() {
            const email = document.getElementById('resetEmail').value.trim();
            const errEl = document.getElementById('resetError');
            errEl.classList.remove('show');
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent =
                    'Enter a valid email.';
                errEl.classList.add('show'); return; }
            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            try {
                await sendPasswordResetEmail(auth, email);
                showToast('Reset link sent! Check email 📧');
                closeReset();
            } catch (err) {
                let msg = 'Failed to send.';
                if (err.code === 'auth/user-not-found') msg = 'No account with this email.';
                else if (err.code === 'auth/too-many-requests') msg = 'Too many requests. Wait.';
                errEl.textContent = msg;
                errEl.classList.add('show');
            } finally { btn.disabled = false;
                btn.textContent = 'Send Reset Link'; }
        }

        document.getElementById('authForm').addEventListener('submit', handleSubmit);
        toggleLink.addEventListener('click', toggleMode);
        document.getElementById('eyeBtn').addEventListener('click', togglePassword);
        forgotBtn.addEventListener('click', openReset);
        document.getElementById('resetClose').addEventListener('click', closeReset);
        document.getElementById('resetBtn').addEventListener('click', sendReset);
        resetModal.addEventListener('click', function(e) { if (e.target === this) closeReset(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeReset(); });

        onAuthStateChanged(auth, (user) => {
            if (user && (window.location.pathname === '/' || window.location.pathname ===
                    '/index.html' || window.location.pathname === '')) {
                window.location.href = 'home.html';
            }
        });

        console.log('🕊️ SPACchat Auth Ready | Light & Living');
    </script>
</body>
</html>
